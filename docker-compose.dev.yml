services:
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  
  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  celery-worker:
    volumes:
      - ./backend:/app
    command: watchmedo auto-restart --directory=./ --pattern=*.py --recursive -- celery -A core.celery_app worker --loglevel=info
